<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Circle Gradient -->
    <linearGradient id="bg_grad" x1="128" y1="20" x2="128" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#05A67D"/>
      <stop offset="1" stop-color="#014032"/>
    </linearGradient>
    
    <!-- Inner Glow/Reflections -->
    <radialGradient id="inner_glow" cx="128" cy="80" r="90" fx="128" fy="40" gradientUnits="userSpaceOnUse">
      <stop stop-color="white" stop-opacity="0.4"/>
      <stop offset="0.8" stop-color="white" stop-opacity="0"/>
    </radialGradient>

    <!-- Professional Soft Drop Shadow -->
    <filter id="soft_shadow" x="65" y="65" width="126" height="126" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="black" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Solid White Canvas -->
  <rect width="256" height="256" fill="white"/>

  <!-- Main Circular Frame -->
  <circle cx="128" cy="100" r="85" fill="url(#bg_grad)"/>
  <circle cx="128" cy="100" r="85" fill="url(#inner_glow)"/>
  
  <!-- Subtle Border Reflection -->
  <circle cx="128" cy="100" r="84.5" stroke="white" stroke-width="0.5" stroke-opacity="0.3"/>

  <!-- Optimized Bag Icon (Square Variant) -->
  <g filter="url(#soft_shadow)">
    <!-- Rounded Bag Handles (Two loops) -->
    <path d="M106 100V94C106 88 110 84 116 84" stroke="white" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M150 100V94C150 88 146 84 140 84" stroke="white" stroke-width="6" stroke-linecap="round" fill="none"/>
    
    <!-- Large Square Bag Body (Clean Rectangular edges) -->
    <rect x="92" y="100" width="72" height="72" rx="4" fill="white"/>
    
    <!-- Premium Play Button Center -->
    <path d="M120 126L142 136L120 146V126Z" fill="#059669"/>
  </g>

  <!-- Refined Typography -->
  <text x="128" y="218" text-anchor="middle" font-family="'Inter', sans-serif, Arial" font-weight="900" font-size="22" fill="#111827" style="letter-spacing: 0.02em;">LIVE SHOPPING.</text>
  <text x="128" y="242" text-anchor="middle" font-family="'Inter', sans-serif, Arial" font-weight="500" font-size="18" fill="#374151" style="letter-spacing: 0.08em;">WITH AGORA.</text>
</svg>
